[package]
name = "dotwise_gui"
version = "0.1.0"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "dotwise_gui"
path = "src/tauri_main.rs"

[dependencies]
dotwise_core = { path = "../dotwise_core" }
dotwise_video = { path = "../dotwise_video" }
image = { version = "=0.24.9", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.15"

[build-dependencies]
tauri-build = { version = "2", features = [] }
