[package]
name = "dotwise_gui"
version = "0.1.0"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "dotwise_gui"
path = "src/tauri_main.rs"

[dependencies]
dotwise_core = { path = "../dotwise_core" }
dotwise_video = { path = "../dotwise_video" }
rfd = "0.15"
image = { version = "=0.24.9", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
