[package]
name = "dotwise_gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dotwise_gui"
path = "src/main.rs"

[dependencies]
dotwise_core = { path = "../dotwise_core" }
dotwise_video = { path = "../dotwise_video" }
rfd = "0.15"
eframe = { version = "=0.27.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "=0.24.9", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
